name: Yayınla
on:
  push:
    branches: [main]
    paths: ["site/**", "worker/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 25f402b404dbe95e194f83d47a553477
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Site (Cloudflare Pages)
        run: npx --yes wrangler@4 pages deploy site --project-name topraklik --branch main --commit-dirty=true
      - name: Worker (topraklik-web)
        working-directory: worker
        run: npx --yes wrangler@4 deploy
